name: Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  with-optional:
    uses: ./.github/workflows/action.yaml
    with:
        required: "required-value"
        optional: "optional-value"
  without-optional:
    uses: ./.github/workflows/action.yaml
    with:
        required: "required-value"
name: Maven Microservice Continuous Integration

on:
  workflow_call:
    inputs:
      required:
        required: true
        type: string
      optional:
        required: false
        type: string
   
jobs:
  setup:
    name: Test
    runs-on: "ubuntu-latest"
    env:
        COMPUTED: ${{ inputs.optional }}-${{ inputs.required }}
    steps:
      - name: 'Eval'
        run: echo "Hello, ${COMPUTED}"
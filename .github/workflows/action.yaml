name: Eval
on:
  workflow_call:
    inputs:
      required:
        required: true
        type: string
      optional:
        required: false
        type: string
   
jobs:
  eval:
    runs-on: "ubuntu-latest"
    env:
        COMPUTED: ${{ inputs.optional && format('{0}-', inputs.optional) || '' }}${{ inputs.required }}
    steps:
      - name: 'Eval'
        run: echo "Hello, ${COMPUTED}"